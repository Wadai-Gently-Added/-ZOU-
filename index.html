<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SVG Viewer</title>
<style>
  :root{
    --bg: #14161a;
    --panel: #1c1f24;
    --line: #2a2e35;
    --text: #e8e9eb;
    --sub: #8b909a;
    --accent: #5ec9b5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  *{ scrollbar-width:thin; scrollbar-color: #3a3f47 transparent; }
  *::-webkit-scrollbar{ width:6px; height:6px; }
  *::-webkit-scrollbar-track{ background:transparent; }
  *::-webkit-scrollbar-thumb{ background:#3a3f47; border-radius:3px; }
  *::-webkit-scrollbar-thumb:hover{ background:#4a4f58; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    display:flex; flex-direction:column; height:100vh; height:100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- top bar ---------- */
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  #topbar h1{ font-size:15px; font-weight:600; margin:0; letter-spacing:.02em; color:var(--sub);}
  .topbtn{
    background:var(--panel); border:1px solid var(--line);
    color:var(--accent); font-size:12.5px; font-weight:600;
    padding:7px 10px; border-radius:8px;
  }
  .topbtn:active{ background:#262a31; }
  .topbtn.active{ background:var(--accent); color:#0d1210; border-color:var(--accent); }
  .pillgroup{
    display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .pillgroup button{
    background:var(--panel); border:none; color:var(--accent);
    font-size:12.5px; font-weight:600; padding:7px 10px;
    border-right:1px solid var(--line);
  }
  .pillgroup button:last-child{ border-right:none; }
  .pillgroup button:active{ background:#262a31; }

  /* ---------- viewer ---------- */
  #viewerWrap{
    flex:1; position:relative; overflow:hidden;
    background:#fff;
  }
  #viewerWrap.bg-checker{
    background-color:#fff;
    background-image:
      linear-gradient(45deg, #d9dadd 25%, transparent 25%),
      linear-gradient(-45deg, #d9dadd 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #d9dadd 75%),
      linear-gradient(-45deg, transparent 75%, #d9dadd 75%);
    background-size:24px 24px;
    background-position:0 0, 0 12px, 12px -12px, -12px 0px;
  }
  #viewerWrap.bg-white{ background:#fff; }
  #viewerWrap.bg-black{ background:#000; }

  #stage{
    position:absolute; top:50%; left:50%;
    transform-origin:0 0;
    will-change:transform;
  }
  #stage svg{ display:block; max-width:none; }

  #empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; padding:30px; text-align:center;
    color:var(--sub); font-size:14px; line-height:1.6;
  }
  #empty .big{ font-size:15px; color:var(--text); font-weight:600;}

  /* ---------- focus mode ---------- */
  #exitFocusBtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:15; display:none; align-items:center; justify-content:center;
    background:rgba(28,31,36,.8); color:#fff; border:1px solid rgba(255,255,255,.25);
    width:42px; height:42px; border-radius:21px; font-size:17px;
  }
  body.focus-mode #topbar, body.focus-mode #bottombar{ display:none; }
  body.focus-mode #exitFocusBtn{ display:flex; }

  

  .btn.active{ background:var(--accent); color:#0d1210; border-color:var(--accent); font-weight:700; }

  /* ---------- bottom controls ---------- */
  #bottombar{
    flex-shrink:0; border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px;
  }
  .row{ display:flex; gap:8px; }
  .btn{
    flex:1; background:var(--panel); border:1px solid var(--line);
    color:var(--text); padding:11px 8px; border-radius:10px;
    font-size:13px; font-weight:500; text-align:center;
  }
  .btn:active{ background:#262a31; }
  .btn.accent{ background:var(--accent); color:#0d1210; border-color:var(--accent); font-weight:700;}
  .btn.small{ flex:0 0 44px; font-size:16px; padding:11px 0; }
  .bgtoggle{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .bgtoggle button{
    flex:1; background:var(--panel); border:none; color:var(--sub);
    padding:9px 0; font-size:12px; border-right:1px solid var(--line);
  }
  .bgtoggle button:last-child{ border-right:none; }
  .bgtoggle button.active{ background:var(--accent); color:#0d1210; font-weight:700; }

  textarea#pasteArea{
    display:none;
  }

  /* ---------- paste sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:none; z-index:20;
  }
  .sheet-backdrop.open{ display:block; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    background:var(--panel); border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .25s ease;
    max-height:80vh; display:flex; flex-direction:column;
  }
  .sheet.open{ transform:translateY(0); }
  .sheet h2{ font-size:15px; margin:0 0 10px; color:var(--text); }
  .sheet textarea{
    width:100%; height:140px; background:#101215; color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:10px;
    font-family:ui-monospace,Menlo,monospace; font-size:12px; resize:none;
    margin-bottom:10px;
  }
  .sheet .row{ margin-bottom:8px; }
  .sheet-close{
    text-align:center; color:var(--sub); font-size:13px; padding:8px; margin-top:2px;
  }

  /* ---------- saved list sheet ---------- */
  #savedList{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .saved-item{
    display:flex; align-items:center; gap:8px;
    padding:10px 4px; border-bottom:1px solid var(--line);
    min-width:0; max-width:100%; box-sizing:border-box;
  }
  .saved-item .thumb{
    width:44px; height:44px; border-radius:8px; background:#101215;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    overflow:hidden; border:1px solid var(--line);
  }
  .saved-item .thumb svg{ width:100%; height:100%; }
  .saved-item .meta{ flex:1; min-width:0; }
  .saved-item .name{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .saved-item .date{ font-size:11px; color:var(--sub); }
  .saved-item .pin{
    background:none; border:none; font-size:15px; padding:6px 6px;
  }
  .saved-item .handle{
    color:var(--sub); font-size:16px; padding:6px 4px; cursor:grab;
    touch-action:none; flex-shrink:0;
  }
  .print-select-box{ width:18px; height:18px; flex-shrink:0; }
  #printSelectBar{
    display:flex; align-items:center; gap:8px; padding:10px 4px;
    border-top:1px solid var(--line); font-size:12.5px; color:var(--sub);
  }
  #printSelectCount{ flex:1; }
  .saved-item .handle.locked{ cursor:default; font-size:14px; }
  .saved-item.pinned{ background:rgba(255,255,255,.03); }

  .toplevel-block{ margin-top:6px; }
  .toplevel-block.dragging-block{
    background:var(--panel); box-shadow:0 4px 14px rgba(0,0,0,.4); border-radius:8px; opacity:.95;
  }
  .group-block{
    border-left:4px solid var(--accent); border-radius:6px; padding:2px 0 4px 4px;
  }
  .group-block.drop-target{
    outline:2px dashed var(--accent); outline-offset:-2px; border-radius:8px;
  }

  .group-header{
    display:flex; align-items:center; gap:6px; padding:8px 4px 6px;
  }
  .ctx-menu{
    position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.5); padding:6px;
    display:flex; flex-direction:column; min-width:170px;
  }
  .ctx-menu button{
    background:none; border:none; color:var(--text); text-align:left;
    padding:9px 10px; font-size:12.5px; border-radius:6px;
  }
  .ctx-menu button:active{ background:#262a31; }
  .ctx-menu-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .ctx-arrow{ color:var(--sub); font-size:10px; }
  .ctx-submenu{ z-index:51; }
  .color-pick-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60;
    display:flex; align-items:center; justify-content:center;
  }
  .color-pick-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px; width:240px;
  }
  .color-pick-title{ font-size:13px; color:var(--text); margin-bottom:14px; text-align:center; }
  .color-swatch-wrap{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:14px; }
  .color-swatch{
    width:38px; height:38px; border-radius:19px; border:2px solid rgba(255,255,255,.15);
  }
  .color-swatch:active{ transform:scale(.9); }
  .color-pick-cancel{
    width:100%; background:none; border:none; color:var(--sub); font-size:13px; padding:8px;
  }
  .group-header .group-toggle{
    background:none; border:none; color:var(--sub); font-size:11px; padding:2px 4px;
  }
  .group-header .group-handle{
    color:var(--sub); font-size:14px; padding:2px 4px; cursor:grab; touch-action:none;
  }
  .group-header .group-name{ font-size:12.5px; font-weight:700; flex:1; padding-left:4px; }
  .group-select{
    background:var(--panel); color:var(--sub); border:1px solid var(--line);
    border-radius:6px; font-size:10px; max-width:52px; padding:3px 1px; flex-shrink:0;
  }
  .saved-item.dragging{
    background:var(--panel); box-shadow:0 4px 14px rgba(0,0,0,.4); border-radius:8px; opacity:.95;
  }
  .item-block .saved-item{ border-bottom:1px solid var(--line); }
  .saved-item.dragging{
    background:var(--panel); box-shadow:0 4px 14px rgba(0,0,0,.4);
    border-radius:8px; opacity:.95;
  }
  #savedEmpty{ color:var(--sub); font-size:13px; text-align:center; padding:24px 0; }
  .subhead{ font-size:11.5px; color:var(--sub); margin:2px 0 6px; font-weight:600; letter-spacing:.03em; }
  .small-empty{ color:var(--sub); font-size:12.5px; text-align:center; padding:14px 0; }

  input[type=file]{ display:none; }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <h1>SVG VIEWER</h1>
    <div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
      <button id="codeBtn" class="topbtn">🖊 コード</button>
      <div class="pillgroup">
        <button id="listBtn">📂 マイSVG</button>
        <button id="btnSave">＋ 登録</button>
      </div>
    </div>
  </div>

  <div id="viewerWrap" class="bg-white">
    <div id="empty">
      <div class="big">まだSVGが読み込まれてないみゅ</div>
      <div>下のボタンから貼り付け・ファイル選択・クリップボードで読み込んでね</div>
    </div>
    <div id="stage" style="display:none"></div>
  </div>

  <button id="exitFocusBtn">⤢</button>

  <div id="bottombar">
    <div class="row">
      <button class="btn" id="btnClipboard">📋 クリップボード</button>
      <button class="btn" id="btnPaste">✏️ 貼り付け</button>
      <button class="btn" id="btnFile">📁 ファイル</button>
    </div>
    <div class="row">
      <div class="bgtoggle" style="flex:1">
        <button data-bg="checker">透過</button>
        <button data-bg="white" class="active">白</button>
        <button data-bg="black">黒</button>
      </div>
      <button class="btn small" id="btnZoomOut">−</button>
      <button class="btn small" id="btnReset">⟲</button>
      <button class="btn small" id="btnZoomIn">＋</button>
    </div>
    <div class="row">
      <button class="btn" id="btnWake">☀️ 常時点灯</button>
      <button class="btn" id="btnFocus">👁 全体表示</button>
    </div>
  </div>

</div>

<input type="file" id="fileInput" accept=".svg,image/svg+xml" multiple>

<!-- paste sheet -->
<div class="sheet-backdrop" id="pasteBackdrop"></div>
<div class="sheet" id="pasteSheet">
  <h2>SVGコードを貼り付け</h2>
  <textarea id="pasteBox" placeholder="&lt;svg&gt;...&lt;/svg&gt; をここにペースト"></textarea>
  <div class="row">
    <button class="btn accent" id="btnPasteLoad">表示する</button>
  </div>
  <div class="sheet-close" id="pasteCancel">閉じる</div>
</div>

<!-- saved list sheet -->
<div class="sheet-backdrop" id="listBackdrop"></div>
<div class="sheet" id="listSheet" style="max-height:70vh">
  <h2 style="display:flex; align-items:center; justify-content:space-between;">
    マイSVG
    <button id="btnNewGroup" class="topbtn" style="padding:4px 10px;">＋ グループ</button>
  </h2>
  <div id="savedList" style="overflow-y:auto; overflow-x:hidden;"></div>
  <div id="savedEmpty" style="display:none">まだ何も保存してないみゅ</div>
  <div id="printSelectBar" style="display:none;">
    <span id="printSelectCount">選択中: 0件</span>
    <button id="btnPrintSelectGo" class="btn accent" style="flex:0 0 auto; padding:6px 12px;">🖨 印刷する</button>
    <button id="btnPrintSelectCancel" class="btn" style="flex:0 0 auto; padding:6px 12px;">キャンセル</button>
  </div>
  <div class="sheet-close" id="listCancel">閉じる</div>
</div>

<!-- code edit sheet -->
<div class="sheet-backdrop" id="codeBackdrop"></div>
<div class="sheet" id="codeSheet" style="max-height:85vh">
  <h2>SVGコードを編集</h2>
  <textarea id="codeBox" style="height:220px" placeholder="表示中のSVGがまだ無いみゅ"></textarea>
  <div class="row">
    <button class="btn accent" id="btnCodeApply">反映する</button>
  </div>
  <div class="sheet-close" id="codeCancel">閉じる</div>
</div>

<!-- print sheet -->
<div class="sheet-backdrop" id="printBackdrop"></div>
<div class="sheet" id="printSheet" style="max-height:92vh">
  <h2 id="printSheetTitle">印刷プレビュー（2ページ構成）</h2>
  <div class="print-hint">画面ではスクロールで確認できます。実際の印刷/PDFは全ページぶん出力されるよ</div>
  <div id="printArea" style="background:#fff; border-radius:10px; overflow:auto; max-height:74vh; padding:4px;"></div>
  <div class="row">
    <button class="btn accent" id="btnDoPrint">🖨 印刷する</button>
  </div>
  <div class="sheet-close" id="printCancel">閉じる</div>
</div>

<style>
  .print-page{
    background:#fff; color:#111; padding:18px; margin-bottom:14px;
    border:1px solid #ddd; border-radius:6px;
  }
  .print-title{ font-size:15px; font-weight:700; margin-bottom:6px; }
  .print-meta{ font-size:11px; color:#555; margin-bottom:2px; }
  .print-note-label{ font-size:11px; color:#666; margin-top:14px; }
  .print-note-box{ border:1px solid #ddd; min-height:60px; margin-top:4px; padding:6px 8px; font-size:12px; color:#111; outline:none; }
  .print-note-box:empty:before{ content:'ここに書き込めるよ(印刷にも反映されます)'; color:#aaa; }
  .print-hint{ font-size:11.5px; color:var(--sub); margin:-4px 0 10px; line-height:1.5; }
  .print-code{
    font-family:ui-monospace,Menlo,monospace; font-size:10px; line-height:1.5;
    white-space:pre-wrap; word-break:break-all; background:#fafafa;
    border:1px solid #ddd; border-radius:6px; padding:10px; margin-top:10px;
  }

  /* 画像モード: 折り紙手順書のような番号+矢印フロー */
  .flow-grid{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px;
  }
  .flow-step{
    display:flex; flex-direction:column; align-items:center; width:140px;
    border:1px solid #eee; border-radius:8px; padding:8px; background:#fafafa;
  }
  .flow-num{
    width:22px; height:22px; border-radius:11px; background:#333; color:#fff;
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;
    margin-bottom:6px;
  }
  .flow-svg{ width:100%; height:100px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .flow-svg svg{ max-width:100%; max-height:100%; }
  .flow-name{ font-size:10px; color:#555; margin-top:4px; text-align:center; word-break:break-all; }
  .flow-arrow{ font-size:22px; color:#999; flex-shrink:0; }

  /* コードモード: 一覧表+各コード */
  .code-list-table{ width:100%; font-size:11px; border-collapse:collapse; margin-top:10px; }
  .code-list-table th, .code-list-table td{ border:1px solid #ddd; padding:5px 8px; text-align:left; }
  .code-list-table th{ background:#f5f5f5; color:#555; font-weight:600; }
  .code-entry{ margin-top:16px; }
  .code-entry-title{ font-size:12px; font-weight:700; color:#333; margin-bottom:4px; }

  .checklist-list{ margin-top:16px; }
  .checklist-row{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px solid #eee; font-size:14px; color:#111;
  }
  .checklist-box{ font-size:18px; color:#555; }
  .checklist-num{ color:#888; font-size:12px; min-width:20px; }
  .checklist-name{ font-weight:600; }

  @page{ size: A4; margin: 12mm; }
  @media print{
    html, body{ background:#fff !important; }
    body *{ visibility:hidden; }
    .sheet-backdrop{ display:none !important; }
    #printSheet, #printSheet *{ visibility:visible; }
    #printSheet{
      position:absolute; left:0; top:0; width:100%; max-height:none;
      transform:none; border:none; background:#fff !important; padding:0;
    }
    #printSheet .sheet-close, #printSheet #btnDoPrint, #printSheet h2, .print-hint{ display:none; }
    #printArea{ max-height:none; overflow:visible; padding:0; background:#fff !important; }
    .print-page{ border:none; padding:14mm; background:#fff !important; }
    .flow-step, .code-entry{ page-break-inside:avoid; }
  }
  /* PC(横幅ある画面)だけプレビュー/コードを別ページに分割。
     スマホのスタンドアロン印刷はpage-breakがほぼ無視されるので
     そちらは縦に繋がった1ページのままにする */
  @media print and (min-width: 768px){
    .print-page{ page-break-after:always; }
    .print-page:last-child{ page-break-after:auto; }
  }
</style>

<script>
(function(){
  const stage = document.getElementById('stage');
  const empty = document.getElementById('empty');
  const wrap = document.getElementById('viewerWrap');
  const STORE_KEY = 'svgViewerSavedItems';
  const GROUPS_KEY = 'svgViewerGroups';
  const TOPORDER_KEY = 'svgViewerTopOrder';
  const GROUP_COLORS = ['#e0625c','#e0b85c','#7ea6e0','#b57ee0','#e07eb8','#8bd17e'];
  function getGroups(){
    try{ return JSON.parse(localStorage.getItem(GROUPS_KEY) || '[]'); }
    catch(e){ return []; }
  }
  function setGroups(arr){
    try{ localStorage.setItem(GROUPS_KEY, JSON.stringify(arr)); }
    catch(e){}
  }
  function getTopOrder(){
    try{ return JSON.parse(localStorage.getItem(TOPORDER_KEY) || '[]'); }
    catch(e){ return []; }
  }
  function setTopOrder(arr){
    try{ localStorage.setItem(TOPORDER_KEY, JSON.stringify(arr)); }
    catch(e){}
  }
  // topOrder = グループ化タブ(グループ本体)とグループ化してない個別アイテムが
  // 混ざって並ぶ「Edgeのタブバー」的な並び順。存在しなくなったもの/未登録のものを
  // 自動で整合させる(手動で毎回同期しなくて済むように)
  function reconcileTopOrder(items, groups){
    let order = getTopOrder();
    const groupIds = new Set(groups.map(g=>g.id));
    const looseItemIds = new Set(items.filter(it=>!it.group).map(it=>it.id));
    order = order.filter(e=>{
      if(e.type === 'group') return groupIds.has(e.id);
      if(e.type === 'item') return looseItemIds.has(e.id);
      return false;
    });
    groups.forEach(g=>{
      if(!order.some(e=>e.type==='group' && e.id===g.id)) order.push({type:'group', id:g.id});
    });
    items.forEach(it=>{
      if(!it.group && !order.some(e=>e.type==='item' && e.id===it.id)) order.push({type:'item', id: it.id});
    });
    setTopOrder(order);
    return order;
  }

  let scale = 1, tx = 0, ty = 0;
  let currentName = null;
  let suppressClickUntil = 0;
  let isDirty = false;

  function applyTransform(){
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function fitToView(){
    const svgEl = stage.querySelector('svg');
    if(!svgEl){ scale = 1; tx = 0; ty = 0; applyTransform(); return; }
    let bbox = null;
    try{ bbox = svgEl.getBBox(); }catch(e){}
    if(!bbox || !bbox.width || !bbox.height){
      scale = 1; tx = 0; ty = 0; applyTransform(); return;
    }
    const rect = wrap.getBoundingClientRect();
    const availW = rect.width * 0.86;
    const availH = rect.height * 0.86;
    let s = Math.min(availW / bbox.width, availH / bbox.height);
    if(!isFinite(s) || s <= 0) s = 1;
    scale = Math.min(s, 10);
    // center the SVG's actual content box (not just its 0,0 origin)
    const cx = bbox.x + bbox.width / 2;
    const cy = bbox.y + bbox.height / 2;
    tx = -cx * scale;
    ty = -cy * scale;
    applyTransform();
  }

  function extractSvgElement(text){
    if(!text || !text.trim()) return null;
    // 1st try: strict XML parse (handles standalone SVG files, with/without xml prolog)
    try{
      const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
      if(!doc.querySelector('parsererror')){
        const root = doc.documentElement;
        if(root && root.tagName && root.tagName.toLowerCase() === 'svg') return root;
      }
    }catch(e){}
    // 2nd try: parse as HTML fragment and look for an <svg> element inside
    // (covers cases where extra text/markup surrounds the svg tag)
    try{
      const doc2 = new DOMParser().parseFromString(text, 'text/html');
      const svgEl = doc2.querySelector('svg');
      if(svgEl) return svgEl;
    }catch(e){}
    return null;
  }

  function loadSVG(text, name){
    const svgSource = extractSvgElement(text);
    if(!svgSource){
      alert('SVGとして読み込めなかったみゅ。中身がSVGコードか確認してね（HTMLや他のテキストは読み込めないよ）');
      return;
    }
    stage.innerHTML = '';
    const svgEl = document.importNode(svgSource, true);
    stage.appendChild(svgEl);
    stage.style.display = 'block';
    empty.style.display = 'none';
    currentName = name || null;

    // never let the svg's own box clip content that sits outside it
    svgEl.style.overflow = 'visible';
    // if a viewBox exists, lock rendered size to it so 1 content
    // unit = 1 css px, keeping our zoom/pan math accurate
    const vb = svgEl.viewBox && svgEl.viewBox.baseVal;
    if(vb && vb.width && vb.height){
      svgEl.style.width = vb.width + 'px';
      svgEl.style.height = vb.height + 'px';
    }
    fitToView();
  }

  /* ---- pinch / pan ---- */
  let pointers = new Map();
  let lastDist = null, lastMid = null;
  let panStart = null;

  wrap.addEventListener('pointerdown', e=>{
    wrap.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 1){
      panStart = { x:e.clientX, y:e.clientY, tx, ty };
    } else if(pointers.size === 2){
      const pts = [...pointers.values()];
      lastDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      lastMid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
    }
  });

  wrap.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size === 1 && panStart){
      tx = panStart.tx + (e.clientX - panStart.x);
      ty = panStart.ty + (e.clientY - panStart.y);
      applyTransform();
    } else if(pointers.size === 2){
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const mid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
      if(lastDist){
        const factor = dist / lastDist;
        const newScale = Math.min(20, Math.max(0.05, scale * factor));
        // zoom around midpoint
        const rect = wrap.getBoundingClientRect();
        const cx = mid.x - rect.left - rect.width/2;
        const cy = mid.y - rect.top - rect.height/2;
        tx = cx - (cx - tx) * (newScale/scale);
        ty = cy - (cy - ty) * (newScale/scale);
        scale = newScale;
        applyTransform();
      }
      lastDist = dist; lastMid = mid;
    }
  });

  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size < 2){ lastDist = null; }
    if(pointers.size === 0){ panStart = null; }
  }
  wrap.addEventListener('pointerup', endPointer);
  wrap.addEventListener('pointercancel', endPointer);

  let lastTap = 0;
  wrap.addEventListener('pointerup', e=>{
    const now = Date.now();
    if(now - lastTap < 280 && pointers.size === 0){
      fitToView();
    }
    lastTap = now;
  });

  /* ---- save / list ---- */
  function getSaved(){
    let arr;
    try{ arr = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
    catch(e){ arr = []; }
    let changed = false;
    arr.forEach(it=>{
      if(!it.id){ it.id = 's' + Date.now() + Math.random().toString(36).slice(2,7); changed = true; }
      if(!it.modifiedAt){ it.modifiedAt = it.savedAt; changed = true; }
    });
    if(changed){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(arr)); }catch(e){} }
    return arr;
  }
  function setSaved(arr){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(arr)); }
    catch(e){ alert('保存に失敗したみゅ（容量オーバーかも）'); }
  }

  function saveCurrent(){
    const svgEl = stage.querySelector('svg');
    if(!svgEl){ alert('保存する内容がまだ無いみゅ'); return false; }
    const arr = getSaved();
    let suggested = currentName || ('SVG ' + new Date().toLocaleString('ja-JP'));
    const base = suggested.replace(/\s*\(\d+\)\s*$/, '');
    const existingNums = arr
      .map(it => it.name)
      .filter(n => n === base || new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*\\(\\d+\\)$').test(n))
      .map(n => {
        const m = n.match(/\((\d+)\)$/);
        return m ? parseInt(m[1], 10) : 1;
      });
    if(existingNums.length){
      const next = Math.max(...existingNums) + 1;
      suggested = base + '(' + next + ')';
    }
    const name = prompt('保存名を入れてね', suggested);
    if(name === null) return false;
    const now = new Date().toISOString();
    arr.unshift({ id: 's' + Date.now() + Math.random().toString(36).slice(2,7), name, content: stage.innerHTML, savedAt: now, modifiedAt: now, pinned:false, group:null });
    setSaved(arr.slice(0, 100));
    isDirty = false;
    return true;
  }

  // 未保存の作業中データを守るための確認モーダル
  function showUnsavedPrompt(onProceed){
    const backdrop = document.createElement('div');
    backdrop.className = 'color-pick-backdrop';
    const panel = document.createElement('div');
    panel.className = 'color-pick-panel';
    panel.innerHTML = `<div class="color-pick-title">今表示中の内容が保存されてないみゅ。<br>どうする？</div>`;
    const row1 = document.createElement('button');
    row1.className = 'btn accent';

    row2.className = 'btn';

    row2.textContent = '保存せず開く';
    row2.onclick = ()=>{

    row3.onclick = ()=> document.body.removeChild(backdrop);
    panel.appendChild(row1);
    panel.appendChild(row2);
    panel.appendChild(row3);
    backdrop.appendChild(panel);
    backdrop.onclick = (e)=>{ if(e.target === backdrop) document.body.removeChild(backdrop); };
    document.body.appendChild(backdrop);
  }
  function guardedLoad(fn){
    if(isDirty){ showUnsavedPrompt(fn); }
    else{ fn(); }
  }

  function downloadCurrentSVG(){
    const svgEl = stage.querySelector('svg');
    if(!svgEl){ alert('保存する内容がまだ無いみゅ'); return; }
    const defaultName = (currentName || 'svg-export').replace(/\.[a-zA-Z0-9]+$/, '');
    const name = prompt('ファイル名を入れてね（拡張子は自動でつくよ）', defaultName);
    if(name === null) return;
    let svgText = svgEl.outerHTML;
    if(!svgText.includes('xmlns=')){
      svgText = svgText.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    }
    const blob = new Blob([svgText], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (name.trim() || 'svg-export') + '.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 3000);
  }

  /* ---- wake lock (常時点灯) ---- */
  const wakeBtn = document.getElementById('btnWake');
  const wakeSupported = ('wakeLock' in navigator) && ((navigator.maxTouchPoints || 0) > 0);
  if(!wakeSupported){
    wakeBtn.style.display = 'none';
  }
  let wakeLock = null;
  let wakeLockWanted = false;
  async function requestWakeLock(){
    if(!('wakeLock' in navigator)) return false;
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
      return true;
    }catch(e){ return false; }
  }
  if(wakeSupported){
    wakeBtn.onclick = async ()=>{
      if(wakeLockWanted){
        wakeLockWanted = false;
        if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null; }
        wakeBtn.classList.remove('active');
      } else {
        const ok = await requestWakeLock();
        if(ok){ wakeLockWanted = true; wakeBtn.classList.add('active'); }
        else alert('スリープ防止をオンにできなかったみゅ');
      }
    };
    document.addEventListener('visibilitychange', ()=>{
      if(wakeLockWanted && document.visibilityState === 'visible' && !wakeLock){
        requestWakeLock();
      }
    });
  }

  /* ---- focus mode (UIを隠す) ---- */
  document.getElementById('btnFocus').onclick = ()=>{

  /* ---- print sheet ---- */
  const printSheet = document.getElementById('printSheet');
  const printBackdrop = document.getElementById('printBackdrop');

  function escHtml(s){
    return (s == null ? '' : String(s)).replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmtDate(iso){
    if(!iso) return '-';
    try{ return new Date(iso).toLocaleString('ja-JP'); }catch(e){ return '-'; }
  }

  // ビューア表示用に固定px幅/高さが焼き付いたSVGコードを、
  // 印刷の小さな枠にきれいに収まるよう相対サイズに作り替える
  function svgForThumbnail(code){
    try{
      const tmp = document.createElement('div');
      tmp.innerHTML = code;
      const svgEl = tmp.querySelector('svg');
      if(svgEl){
        svgEl.removeAttribute('width');
        svgEl.removeAttribute('height');
        svgEl.style.width = '100%';
        svgEl.style.height = '100%';
        svgEl.style.maxWidth = '100%';
        svgEl.style.maxHeight = '100%';
        svgEl.style.overflow = 'visible';
        if(!svgEl.getAttribute('preserveAspectRatio')){
          svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        }
        return tmp.innerHTML;
      }
    }catch(e){}
    return code;
  }

  // ① 画像モード: 折り紙の手順書のように「①SVG+ファイル名」を→でつないで並べる
  function buildFlowSection(items){
    const cells = items.map((it, i)=>{
      const nameEsc = escHtml(it.name || '(無題)');
      return `
        <div class="flow-step">
          <div class="flow-num">${i+1}</div>
          <div class="flow-svg">${svgForThumbnail(it.content)}</div>
          <div class="flow-name">${nameEsc}</div>
        </div>`;
    });
    const parts = [];
    cells.forEach((c,i)=>{
      parts.push(c);
      if(i < cells.length - 1) parts.push('<div class="flow-arrow">→</div>');
    });
    return `
      <div class="print-page flow-page">
        <div class="print-title">SVG 手順</div>
        <div class="flow-grid">${parts.join('')}</div>
        <div class="print-note-label">備考・メモ欄（タップして入力できるよ）</div>
        <div class="print-note-box" contenteditable="true"></div>
      </div>
    `;
  }

  // ② コードモード: ファイル名+作成日時+修正日時の一覧表 → その下に各コード
  function buildCodeListSection(items){
    const rows = items.map((it,i)=>{
      const nameEsc = escHtml(it.name || '(無題)');
      return `<tr><td>${i+1}</td><td>${nameEsc}</td><td>${fmtDate(it.savedAt)}</td><td>${fmtDate(it.modifiedAt || it.savedAt)}</td></tr>`;
    }).join('');
    const entries = items.map((it,i)=>{
      const nameEsc = escHtml(it.name || '(無題)');
      const codeEsc = escHtml(it.content);
      return `
        <div class="code-entry">
          <div class="code-entry-title">${i+1}. ${nameEsc}</div>
          <pre class="print-code">${codeEsc}</pre>
        </div>`;
    }).join('');
    return `
      <div class="print-page">
        <div class="print-title">SVG コード一覧</div>
        <table class="code-list-table">
          <thead><tr><th>#</th><th>ファイル名</th><th>作成日時</th><th>修正日時</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${entries}
      </div>
    `;
  }

  // mode: 'image' | 'code' | 'both'  /  items: [{name, content, savedAt, modifiedAt}, ...]
  function buildPrintOutput(items, mode){
    let html = '';
    if(mode === 'image' || mode === 'both') html += buildFlowSection(items);
    if(mode === 'code' || mode === 'both') html += buildCodeListSection(items);
    return html;
  }

  function printModeLabel(mode){
    return mode === 'image' ? 'SVG' : mode === 'code' ? 'コード' : 'SVG＋コード';
  }

  function openPrintSheet(html, title){

    document.getElementById('printSheetTitle').textContent = title || '印刷プレビュー';

    printSheet.classList.add('open'); printBackdrop.classList.add('open');

  function printSubmenuOptions(onPick){

  function openSinglePrint(name, code, mode, meta){
    const now = new Date().toISOString();
    const item = {
      name,
      content: code,
      savedAt: (meta && meta.savedAt) || now,
      modifiedAt: (meta && meta.modifiedAt) || (meta && meta.savedAt) || now
    };
    openPrintSheet(buildPrintOutput([item], mode), `${name || '(無題)'}　印刷（${printModeLabel(mode)}）`);
  }

  function buildChecklistHTML(groupName, items){

      return `

    return `

        <div class="print-title">${nameEsc}　一覧</div>

  }

  function openGroupPrint(groupId, groupName, mode){
    const items = getSaved().filter(it => (it.group||null) === groupId);
    if(items.length === 0){ alert('このグループにはSVGが無いみゅ'); return; }
    // 複数件まとめて印刷する時は先頭に一覧(チェックリスト)ページを付ける
    const indexHtml = items.length > 1 ? buildChecklistHTML(groupName, items) : '';

  function commitOrder(container){
    const rows = Array.from(container.children);
    const arr = getSaved();
    const groupId = container.dataset.group || null;
    const byId = {};
    arr.forEach(it => byId[it.id] = it);

  function attachTopLevelDrag(block){
    const handle = block.querySelector('.group-handle') || block.querySelector('.handle');
    if(!handle) return;
    handle.addEventListener('pointerdown', (e)=>{
      if(e.button !== 0) return;
      e.preventDefault();
      const listEl = document.getElementById('savedList');
      let startY = e.clientY;
      block.classList.add('dragging-block');
      block.style.zIndex = 6;
      const isGroupBlock = block.classList.contains('group-block');
      let hoverGroupBlock = null;

      function onMove(ev){
        const dy = ev.clientY - startY;
        block.style.transform = `translateY(${dy}px)`;

        if(!isGroupBlock){
          // 個別アイテムをグループの上まで持っていったらそこにポトンと入れられる
          const groupBlocks = Array.from(listEl.querySelectorAll('.group-block'));
          let matched = null;
          for(const gb of groupBlocks){
            const r = gb.getBoundingClientRect();
            if(ev.clientY >= r.top && ev.clientY <= r.bottom){ matched = gb; break; }
          }
          if(hoverGroupBlock && hoverGroupBlock !== matched) hoverGroupBlock.classList.remove('drop-target');
          if(matched) matched.classList.add('drop-target');
          hoverGroupBlock = matched;
          if(hoverGroupBlock) return;
        }

        const blocks = Array.from(listEl.children).filter(el => el.classList.contains('toplevel-block'));
        const idx = blocks.indexOf(block);
        const rect = block.getBoundingClientRect();
        const centerY = rect.top + rect.height/2;
        for(let k=0;k<blocks.length;k++){
          if(blocks[k] === block) continue;
          const r2 = blocks[k].getBoundingClientRect();
          const otherCenter = r2.top + r2.height/2;
          if(k < idx && centerY < otherCenter){
            listEl.insertBefore(block, blocks[k]);
            startY = ev.clientY; block.style.transform = 'translateY(0px)'; break;
          }
          if(k > idx && centerY > otherCenter){
            listEl.insertBefore(block, blocks[k].nextSibling);
            startY = ev.clientY; block.style.transform = 'translateY(0px)'; break;
          }
        }
      }
      function onUp(){
        block.classList.remove('dragging-block');
        block.style.transform = '';
        block.style.zIndex = '';
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);

        if(hoverGroupBlock){
          hoverGroupBlock.classList.remove('drop-target');
          const targetGroupId = hoverGroupBlock.dataset.entryId;
          const itemId = block.dataset.entryId;
          const cur = getSaved();
          const it = cur.find(x => x.id === itemId);
          if(it){ it.group = targetGroupId; setSaved(cur); }
          renderList();
          return;
        }

        const blocks = Array.from(listEl.children).filter(el => el.classList.contains('toplevel-block'));
        const newOrder = blocks.map(b => ({ type: b.dataset.entryType, id: b.dataset.entryId }));
        setTopOrder(newOrder);
        renderList();
      }
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }

  function attachDrag(row){
    const handle = row.querySelector('.handle');
    handle.addEventListener('pointerdown', (e)=>{
      if(e.button !== 0) return;
      e.preventDefault();
      const container = row.parentElement;
      const ownBlock = container.parentElement; // .group-block
      const ownGroupId = container.dataset.group || null;
      const listEl = document.getElementById('savedList');
      let startY = e.clientY;
      let lastY = e.clientY;
      row.classList.add('dragging');
      row.style.zIndex = 6;
      let hoverTarget = null;

      function onMove(ev){
        lastY = ev.clientY;
        const dy = ev.clientY - startY;
        row.style.transform = `translateY(${dy}px)`;

        // 別のグループの上まで来てたらそこにドロップできる状態にする
        // (見出しだけじゃなく、中身も含めたブロック全体が対象。
        //  自分が今いるグループの上に乗ってもハイライトしない=普通の並べ替え扱い)
        const blocks = Array.from(listEl.querySelectorAll('.group-block'));
        let matched = null;
        for(const b of blocks){
          if(b.dataset.entryId === ownGroupId) continue;
          const r = b.getBoundingClientRect();
          if(ev.clientY >= r.top && ev.clientY <= r.bottom){ matched = b; break; }
        }
        if(hoverTarget && hoverTarget !== matched) hoverTarget.classList.remove('drop-target');
        if(matched) matched.classList.add('drop-target');
        hoverTarget = matched;

        if(hoverTarget) return; // 別グループに乗ってる間は並べ替え計算はしない

        const rows = Array.from(container.children);
        const idx = rows.indexOf(row);
        const rowRect = row.getBoundingClientRect();
        const centerY = rowRect.top + rowRect.height/2;
        for(let k=0;k<rows.length;k++){
          if(rows[k] === row) continue;
          if(rows[k].classList.contains('pinned')) continue;
          const r2 = rows[k].getBoundingClientRect();
          const otherCenter = r2.top + r2.height/2;
          if(k < idx && centerY < otherCenter){
            container.insertBefore(row, rows[k]);
            startY = ev.clientY;
            row.style.transform = 'translateY(0px)';
            break;
          }
          if(k > idx && centerY > otherCenter){
            container.insertBefore(row, rows[k].nextSibling);
            startY = ev.clientY;
            row.style.transform = 'translateY(0px)';
            break;
          }
        }
      }
      function onUp(){
        row.classList.remove('dragging');
        row.style.transform = '';
        row.style.zIndex = '';
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);

        if(hoverTarget){
          hoverTarget.classList.remove('drop-target');
          const groupId = hoverTarget.dataset.entryId || null;
          const cur = getSaved();
          const it = cur.find(x => x.id === row.dataset.itemId);
          if(it) it.group = groupId;
          setSaved(cur);
          renderList();
          return;
        }

        // 自分のグループブロックの外まで持ち出したらグループ解除
        const ownRect = ownBlock.getBoundingClientRect();
        if(lastY < ownRect.top - 4 || lastY > ownRect.bottom + 4){
          const cur = getSaved();
          const it = cur.find(x => x.id === row.dataset.itemId);
          if(it) it.group = null;
          setSaved(cur);
          renderList();
          return;
        }

        commitOrder(container);
      }
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }

  function closeContextMenu(){
    const el = document.getElementById('ctxMenu');
    if(el) el.remove();
    document.querySelectorAll('.ctx-submenu').forEach(el2 => el2.remove());
  }

  function positionFlyout(el, anchorRect){
    const fw = el.offsetWidth, fh = el.offsetHeight;
    let left = anchorRect.right + 2;
    if(left + fw > window.innerWidth) left = anchorRect.left - fw - 2;
    let top = anchorRect.top;
    if(top + fh > window.innerHeight) top = window.innerHeight - fh - 8;
    if(top < 8) top = 8;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }

  function showContextMenu(x, y, options){
    closeContextMenu();
    const menu = document.createElement('div');
    menu.className = 'ctx-menu';
    menu.id = 'ctxMenu';

    options.forEach(opt=>{
      const btn = document.createElement('button');
      btn.className = 'ctx-menu-item';

      if(opt.submenu){
        btn.innerHTML = `<span>${opt.label}</span><span class="ctx-arrow">▶</span>`;
        let flyout = null;
        let hideTimer = null;

        function buildFlyout(){
          const f = document.createElement('div');
          f.className = 'ctx-menu ctx-submenu';
          opt.submenu.forEach(sub=>{
            const sbtn = document.createElement('button');
            sbtn.className = 'ctx-menu-item';
            sbtn.textContent = sub.label;
            sbtn.onclick = (e)=>{
              e.stopPropagation();
              sub.onClick();
              closeContextMenu();
            };
            f.appendChild(sbtn);
          });
          document.body.appendChild(f);
          positionFlyout(f, btn.getBoundingClientRect());
          f.addEventListener('mouseenter', ()=>{ if(hideTimer) clearTimeout(hideTimer); });
          f.addEventListener('mouseleave', scheduleHide);
          return f;
        }
        function scheduleHide(){
          hideTimer = setTimeout(()=>{
            if(flyout){ flyout.remove(); flyout = null; }
          }, 220);
        }
        btn.addEventListener('mouseenter', ()=>{
          if(hideTimer) clearTimeout(hideTimer);
          if(!flyout) flyout = buildFlyout();
        });
        btn.addEventListener('mouseleave', scheduleHide);
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          if(flyout){ flyout.remove(); flyout = null; }
          else flyout = buildFlyout();
        });
      } else {
        btn.textContent = opt.label;
        btn.onclick = (e)=>{
          e.stopPropagation();
          opt.onClick();
          closeContextMenu();
        };
      }
      menu.appendChild(btn);
    });

    document.body.appendChild(menu);
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let left = x, top = y;
    if(left + mw > window.innerWidth) left = window.innerWidth - mw - 8;
    if(top + mh > window.innerHeight) top = window.innerHeight - mh - 8;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    setTimeout(()=>{
      document.addEventListener('click', closeContextMenu, { once:true });
    }, 0);
  }

  function pickGroupColor(callback){
    const backdrop = document.createElement('div');
    backdrop.className = 'color-pick-backdrop';
    const panel = document.createElement('div');
    panel.className = 'color-pick-panel';
    const title = document.createElement('div');
    title.className = 'color-pick-title';
    title.textContent = 'グループの色を選んでね';
    panel.appendChild(title);
    const swatchWrap = document.createElement('div');
    swatchWrap.className = 'color-swatch-wrap';
    GROUP_COLORS.forEach(c=>{
      const sw = document.createElement('button');
      sw.className = 'color-swatch';
      sw.style.background = c;
      sw.onclick = (e)=>{
        e.stopPropagation();
        document.body.removeChild(backdrop);
        callback(c);
      };
      swatchWrap.appendChild(sw);
    });
    panel.appendChild(swatchWrap);
    const cancel = document.createElement('button');
    cancel.className = 'color-pick-cancel';
    cancel.textContent = 'キャンセル';
    cancel.onclick = ()=> document.body.removeChild(backdrop);
    panel.appendChild(cancel);
    backdrop.appendChild(panel);
    backdrop.onclick = (e)=>{ if(e.target === backdrop) document.body.removeChild(backdrop); };
    document.body.appendChild(backdrop);
  }

  function buildItemRow(item, i, groups, isTopLevel){
    const row = document.createElement('div');
    row.className = 'saved-item' + (item.pinned ? ' pinned' : '');
    row.dataset.origIdx = i;
    row.dataset.itemId = item.id;
    row.dataset.group = item.group || '';
    const d = new Date(item.savedAt);
    const inSelectMode = (printSelectGroupId !== null) && ((item.group||null) === printSelectGroupId);
    const handleHtml = inSelectMode
      ? `<input type="checkbox" class="print-select-box" ${printSelectedIds.has(item.id) ? 'checked' : ''}>`
      : (item.pinned
        ? '<span class="handle locked" title="ピン留め中は固定">📌</span>'
        : '<span class="handle" title="ドラッグで並べ替え">⠿</span>');
    const options = ['<option value="">グループなし</option>']
      .concat(groups.map(g => `<option value="${g.id}" ${item.group===g.id?'selected':''}>${g.name}</option>`));
    row.innerHTML = `
      ${handleHtml}
      <div class="thumb">${item.content}</div>
      <div class="meta">
        <div class="name">${item.name}</div>
        <div class="date">${d.toLocaleDateString('ja-JP')} ${d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <select class="group-select">${options.join('')}</select>
      <button class="pin" title="ピン留め">${item.pinned ? '📌' : '📍'}</button>
    `;
    if(inSelectMode){
      const box = row.querySelector('.print-select-box');
      box.addEventListener('click', ev=> ev.stopPropagation());
      box.addEventListener('change', ()=>{
        if(box.checked) printSelectedIds.add(item.id); else printSelectedIds.delete(item.id);
        updatePrintSelectBar();
      });
    }
    row.querySelector('.thumb').addEventListener('click', ()=>{
      if(Date.now() < suppressClickUntil) return;
      if(inSelectMode){
        const box = row.querySelector('.print-select-box');
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change'));
        return;
      }
      guardedLoad(()=>{
        loadSVG(item.content, item.name);
        isDirty = false;
        renderList();
      });
    });
    row.querySelector('.group-select').addEventListener('click', ev=> ev.stopPropagation());
    row.querySelector('.group-select').addEventListener('change', (ev)=>{
      const cur = getSaved();
      const it = cur.find(x=>x.id===item.id);
      if(it) it.group = ev.target.value || null;
      setSaved(cur);
      renderList();
    });
    row.addEventListener('contextmenu', (ev)=>{
      ev.preventDefault();
      suppressClickUntil = Date.now() + 500;
      const allGroups = getGroups();
      const opts = [];
      opts.push({ label: '✏️ 名前を変更', onClick: ()=>{
        const newName = prompt('名前を変更', item.name);
        if(newName === null || !newName.trim()) return;
        const cur = getSaved();
        const it = cur.find(x=>x.id===item.id);
        if(it){ it.name = newName.trim(); it.modifiedAt = new Date().toISOString(); }
        setSaved(cur);
        renderList();
      }});
      opts.push({ label: '🖨 印刷', submenu: printSubmenuOptions((mode)=>{
        openSinglePrint(item.name, item.content, mode, { savedAt: item.savedAt, modifiedAt: item.modifiedAt });
      })});
      opts.push({ label: '🆕 新しいグループを作る', onClick: ()=>{
        const name = prompt('グループ名を入れてね', '新しいグループ');
        if(!name || !name.trim()) return;
        pickGroupColor((color)=>{
          const groups = getGroups();
          const newGroup = { id: 'g' + Date.now(), name: name.trim(), color, collapsed:false };
          groups.push(newGroup);
          setGroups(groups);
          const cur = getSaved();
          const it = cur.find(x=>x.id===item.id);
          if(it) it.group = newGroup.id;
          setSaved(cur);
          renderList();
        });
      }});
      allGroups.forEach(g=>{
        if((item.group||null) !== g.id){
          opts.push({ label: `📁 ${g.name} へ移動`, onClick: ()=>{
            const cur = getSaved(); const it = cur.find(x=>x.id===item.id); if(it) it.group = g.id; setSaved(cur); renderList();
          }});
        }
      });
      if(item.group){
        opts.push({ label: '🚫 グループ解除', onClick: ()=>{
          const cur = getSaved(); const it = cur.find(x=>x.id===item.id); if(it) it.group = null; setSaved(cur); renderList();
        }});
      }
      opts.push({ label: '🗑 削除', onClick: ()=>{
        if(!confirm(`「${item.name}」を削除する？元に戻せないよ`)) return;
        const cur = getSaved().filter(x=>x.id!==item.id);
        setSaved(cur);
        renderList();
      }});
      showContextMenu(ev.clientX, ev.clientY, opts);
    });
    row.querySelector('.pin').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const cur = getSaved();
      const it = cur.find(x=>x.id===item.id);
      if(it) it.pinned = !it.pinned;
      setSaved(cur);
      renderList();
    });
    if(!item.pinned && !isTopLevel && !inSelectMode) attachDrag(row);
    return row;
  }

  function renderList(){
    const items = getSaved();
    const groups = getGroups();
    const listEl = document.getElementById('savedList');
    const emptyEl = document.getElementById('savedEmpty');
    listEl.innerHTML = '';
    if(items.length === 0){ emptyEl.style.display='block'; return; }
    emptyEl.style.display='none';
    const order = reconcileTopOrder(items, groups);

    order.forEach(entry=>{
      if(entry.type === 'group'){
        const g = groups.find(x=>x.id===entry.id);
        if(!g) return;

        const block = document.createElement('div');
        block.className = 'toplevel-block group-block';
        block.dataset.entryType = 'group';
        block.dataset.entryId = g.id;
        block.style.borderLeftColor = g.color;
        block.style.background = g.color + '14';

        const header = document.createElement('div');
        header.className = 'group-header';
        header.dataset.groupId = g.id;
        header.innerHTML = `
          <span class="group-handle" title="ドラッグで並べ替え">⠿</span>
          <button class="group-toggle">${g.collapsed ? '▶' : '▼'}</button>
          <span class="group-name">${g.name}</span>
        `;
        block.appendChild(header);

        // ボタンの配線はアイテム描画より先にやる
        // (アイテム側で何かエラーが起きても、ここは必ず動くように)
        header.querySelector('.group-toggle').onclick = ()=>{
          g.collapsed = !g.collapsed;
          setGroups(groups);
          renderList();
        };
        header.addEventListener('contextmenu', (ev)=>{
          ev.preventDefault();
          suppressClickUntil = Date.now() + 500;
          showContextMenu(ev.clientX, ev.clientY, [
            { label: '✏️ 名前を変更', onClick: ()=>{
              const newName = prompt('グループ名を変更', g.name);
              if(newName && newName.trim()){ g.name = newName.trim(); setGroups(groups); renderList(); }
            }},
            { label: '🎨 色を変える', onClick: ()=>{
              pickGroupColor((color)=>{
                g.color = color; setGroups(groups); renderList();
              });
            }},
            { label: '🖨 印刷', submenu: printSubmenuOptions((mode)=>{
              closeList();
              openGroupPrint(g.id, g.name, mode);
            })},
            { label: '☑️ 選んで印刷', onClick: ()=>{
              enterPrintSelectMode(g.id);
            }},
            { label: '🗑 グループ削除', onClick: ()=>{
              if(!confirm(`「${g.name}」を削除する？中のSVGは消えずにバラバラに戻るよ`)) return;
              const cur = getSaved();
              cur.forEach(it=>{ if(it.group === g.id) it.group = null; });
              setSaved(cur);
              setGroups(groups.filter(x=>x.id!==g.id));
              renderList();
            }}
          ]);
        });

        const body = document.createElement('div');
        body.className = 'group-body';
        body.dataset.group = g.id;
        if(g.collapsed) body.style.display = 'none';
        block.appendChild(body);

        try{
          const itemsWithIdx = items
            .map((item,i)=>({item,i}))
            .filter(o => (o.item.group||null) === g.id)
            .sort((a,b)=> (b.item.pinned?1:0) - (a.item.pinned?1:0));
          itemsWithIdx.forEach(({item,i})=>{
            body.appendChild(buildItemRow(item, i, groups, false));
          });
        }catch(err){
          console.error('group item render failed', err);
        }

        attachTopLevelDrag(block);
        listEl.appendChild(block);

      } else if(entry.type === 'item'){
        const idx = items.findIndex(it => it.id === entry.id);
        if(idx === -1) return;
        const item = items[idx];

        const block = document.createElement('div');
        block.className = 'toplevel-block item-block';
        block.dataset.entryType = 'item';
        block.dataset.entryId = item.id;
        block.appendChild(buildItemRow(item, idx, groups, true));
        if(!item.pinned) attachTopLevelDrag(block);
        listEl.appendChild(block);
      }
    });
    updatePrintSelectBar();
  }

  document.getElementById('btnPrintSelectCancel').onclick = exitPrintSelectMode;
  document.getElementById('btnPrintSelectGo').onclick = (ev)=>{
    if(printSelectedIds.size === 0){ alert('1件も選ばれてないみゅ'); return; }
    const groupId = printSelectGroupId;
    const groups = getGroups();
    const g = groups.find(x=>x.id===groupId);
    const items = getSaved().filter(it => printSelectedIds.has(it.id));
    showPrintFlyoutFromButton(ev.currentTarget, (mode)=>{
      exitPrintSelectMode();
      closeList();
      openMultiPrint(items, mode, g ? g.name : '選択した項目');
    });
  };
  function showPrintFlyoutFromButton(btnEl, onPick){
    const r = btnEl.getBoundingClientRect();
    showContextMenu(r.left, r.top - 8, printSubmenuOptions(onPick));
  }

  document.getElementById('btnNewGroup').onclick = ()=>{
    const name = prompt('グループ名を入れてね', '新しいグループ');
    if(!name || !name.trim()) return;
    pickGroupColor((color)=>{
      const groups = getGroups();
      groups.push({ id: 'g' + Date.now(), name: name.trim(), color, collapsed:false });
      setGroups(groups);
      renderList();
    });
  };

  function openList(){ renderList(); listSheet.classList.add('open'); listBackdrop.classList.add('open'); }
  function closeList(){ listSheet.classList.remove('open'); listBackdrop.classList.remove('open'); }
  document.getElementById('listBtn').onclick = openList;
  document.getElementById('listCancel').onclick = closeList;
  listBackdrop.onclick = closeList;

})();
</script>
