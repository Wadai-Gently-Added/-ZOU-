<!-- index.html — HTML骨組み。ロジックはjs/、見た目はstyle.cssに分離 -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 開発中の診断用: どこかのJSでエラーが起きたら画面上部に赤帯で表示する。
     iPadなどF12(開発者ツール)が使えない端末でも、実際のエラー内容がその場で分かるようにするため。
     全てのscriptタグより先に読み込み、他ファイルのエラーも漏らさず拾う -->
<script>
window.addEventListener('error', function(e){
  try{
    var msg = '⚠️ JSエラー: ' + (e.message||'不明') + '\n' + (e.filename||'') + ' 行:' + (e.lineno||'?') + ':' + (e.colno||'?');
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;font-size:12px;padding:10px;white-space:pre-wrap;word-break:break-all;font-family:monospace;';
    box.textContent = msg;
    document.addEventListener('DOMContentLoaded', function(){ document.body.appendChild(box); });
    if(document.body) document.body.appendChild(box);
  }catch(err){}
});
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>造 -ZOU-</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="app">

  <div id="modeTabs">
    <button class="mode-tab active" id="tabSvg" data-mode="svg"></button>
    <button class="mode-tab" id="tabHtml" data-mode="html"></button>
    <select id="langSelect" title="Language">
      <option value="ja">JA</option>
      <option value="en">EN</option>
      <option value="es">ES</option>
      <option value="fr">FR</option>
      <option value="ko">KO</option>
      <option value="zh">ZH</option>
      <option value="de">DE</option>
      <option value="it">IT</option>
      <option value="pt">PT</option>
      <option value="ru">RU</option>
      <option value="el">EL</option>
    </select>
  </div>

  <div id="topbar">
    <h1 id="appTitle">造 -ZOU-</h1>
    <div style="display:flex; gap:6px; flex-wrap:nowrap; justify-content:flex-end; min-width:0;">
      <button id="codeBtn" class="topbtn"><span id="codeBtnLabel"></span></button>
      <button id="btnHtmlInteract" class="topbtn" style="display:none;"></button>
      <div class="pillgroup">
        <button id="listBtn"><span id="listBtnLabel"></span></button>
        <button id="btnSave"></button>
      </div>
    </div>
  </div>

  <div id="viewerWrap" class="bg-white">
    <div id="empty">
      <div class="big" id="emptyBig"></div>
      <div id="emptySub"></div>
    </div>
    <div id="stage" style="display:none"></div>
    <div id="interactStage" style="display:none"></div>
  </div>

  <button id="exitFocusBtn"></button>

  <div id="bottombar">
    <div class="row">
      <button class="btn" id="btnClipboard"></button>
      <button class="btn" id="btnPaste"></button>
      <button class="btn" id="btnFile"></button>
    </div>
    <div class="row compact-row">
      <div class="bgtoggle" style="flex:2">
        <button data-bg="checker" id="bgBtnChecker"></button>
        <button data-bg="white" class="active" id="bgBtnWhite"></button>
        <button data-bg="black" id="bgBtnBlack"></button>
      </div>
      <button class="btn" id="btnWake"></button>
      <button class="btn" id="btnFocus"></button>
      <button class="btn accent" id="btnDownloadFile"></button>
    </div>
  </div>

</div>

<input type="file" id="fileInput" accept=".svg,image/svg+xml" multiple>

<!-- paste sheet -->
<div class="sheet-backdrop" id="pasteBackdrop"></div>
<div class="sheet" id="pasteSheet">
  <h2 id="pasteSheetTitle">SVGコードを貼り付け</h2>
  <textarea id="pasteBox" placeholder=""></textarea>
  <div class="row">
    <button class="btn accent" id="btnPasteLoad"></button>
  </div>
  <div class="sheet-close" id="pasteCancel"></div>
</div>

<!-- saved list sheet -->
<div class="sheet-backdrop" id="listBackdrop"></div>
<div class="sheet" id="listSheet" style="max-height:70vh">
  <h2 style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;">
    <span id="listSheetTitle">マイSVG</span>
    <span style="display:flex; gap:6px;">
      <button id="btnBackup" class="topbtn" style="padding:4px 10px;">🗄️</button>
      <button id="btnNewGroup" class="topbtn" style="padding:4px 10px;"></button>
      <button id="btnStartSelectPrint" class="topbtn" style="padding:4px 10px;"></button>
    </span>
  </h2>
  <input type="file" id="backupFileInput" accept="application/json,.json" style="display:none;">
  <input type="file" id="backupSyncFileInput" accept="application/json,.json" style="display:none;">
  <div id="savedList" style="overflow-y:auto; overflow-x:hidden;"></div>
  <div id="savedEmpty" style="display:none"></div>
  <div id="printSelectBar" style="display:none;">
    <span id="printSelectCount"></span>
    <button id="btnPrintSelectGo" class="btn accent" style="flex:0 0 auto; padding:6px 12px;"></button>
    <button id="btnPrintSelectCancel" class="btn" style="flex:0 0 auto; padding:6px 12px;"></button>
  </div>
  <div class="sheet-close" id="listCancel"></div>
</div>

<!-- code edit sheet -->
<div class="sheet-backdrop" id="codeBackdrop"></div>
<div class="sheet" id="codeSheet" style="max-height:85vh">
  <h2 id="codeSheetTitle">SVGコードを編集</h2>
  <button id="btnCodeSearchToggle" class="topbtn" style="padding:4px 10px; float:right; margin-top:-34px;">🔍</button>
  <div id="codeSearchPanel" style="display:none;">
    <div class="code-search-row">
      <input type="text" id="codeSearchInput" placeholder="">
      <label class="code-search-case"><input type="checkbox" id="codeSearchCase"><span>Aa</span></label>
      <span id="codeSearchStatus" class="code-search-status"></span>
      <button id="codeSearchPrev" class="topbtn" style="padding:4px 8px;">◀</button>
      <button id="codeSearchNext" class="topbtn" style="padding:4px 8px;">▶</button>
    </div>
    <div class="code-search-row">
      <input type="text" id="codeReplaceInput" placeholder="">
      <button id="codeReplaceOne" class="topbtn" style="padding:4px 8px;"></button>
      <button id="codeReplaceAll" class="topbtn" style="padding:4px 8px;"></button>
    </div>
  </div>
  <div class="code-editor-wrap">
    <pre id="codeHighlight" aria-hidden="true"></pre>
    <textarea id="codeBox" placeholder="" spellcheck="false"></textarea>
  </div>
  <div class="row">
    <button class="btn accent" id="btnCodeApply"></button>
  </div>
  <div class="sheet-close" id="codeCancel"></div>
</div>

<!-- print sheet -->
<div class="sheet-backdrop" id="printBackdrop"></div>
<div class="sheet" id="printSheet" style="max-height:92vh">
  <h2 id="printSheetTitle">印刷プレビュー（2ページ構成）</h2>
  <div class="print-hint" id="printHint"></div>
  <div id="printArea" style="background:#fff; border-radius:10px; overflow:auto; max-height:74vh; padding:4px;"></div>
  <div class="row">
    <button class="btn accent" id="btnDoPrint"></button>
  </div>
  <div class="sheet-close" id="printCancel"></div>
</div>

<script src="js/storage.js"></script>
<script src="language/ja.js"></script>
<script src="language/en.js"></script>
<script src="language/es.js"></script>
<script src="language/fr.js"></script>
<script src="language/ko.js"></script>
<script src="language/zh.js"></script>
<script src="language/de.js"></script>
<script src="language/it.js"></script>
<script src="language/pt.js"></script>
<script src="language/ru.js"></script>
<script src="language/el.js"></script>
<script src="js/strings.js"></script>
<script src="js/viewer.js"></script>
<script src="js/print.js"></script>
<script src="js/list.js"></script>
<script src="js/mode.js"></script>
</body>
</html>
